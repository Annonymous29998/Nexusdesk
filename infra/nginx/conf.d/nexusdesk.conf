map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream nexusdesk_api {
  server api:4000;
}

upstream nexusdesk_dashboard {
  server dashboard:80;
}

upstream nexusdesk_signaling {
  server signaling:4001;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://nexusdesk_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://nexusdesk_api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /signal/ {
    proxy_pass http://nexusdesk_signaling/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  include /etc/nginx/snippets/guest-preview-locations.conf;

  location / {
    proxy_pass http://nexusdesk_dashboard/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
