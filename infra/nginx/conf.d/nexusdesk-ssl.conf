# HTTPS + WebSocket (mount /etc/letsencrypt in docker-compose for production).
server {
  listen 443 ssl;
  http2 on;
  server_name nesuxdesk.xyz www.nesuxdesk.xyz;

  ssl_certificate /etc/letsencrypt/live/nesuxdesk.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nesuxdesk.xyz/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://nexusdesk_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://nexusdesk_api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /signal/ {
    proxy_pass http://nexusdesk_signaling/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://nexusdesk_dashboard/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name nesuxdesk.xyz www.nesuxdesk.xyz;
  return 301 https://$host$request_uri;
}
