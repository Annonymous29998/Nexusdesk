# Apex/www still hitting AWS during DNS cutover — send traffic to Vercel.
server {
  listen 443 ssl;
  http2 on;
  server_name nesuxdesk.xyz www.nesuxdesk.xyz;

  ssl_certificate /etc/letsencrypt/live/nesuxdesk.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nesuxdesk.xyz/privkey.pem;

  return 301 https://www.nesuxdesk.xyz$request_uri;
}

server {
  listen 80;
  server_name nesuxdesk.xyz www.nesuxdesk.xyz;
  return 301 https://www.nesuxdesk.xyz$request_uri;
}
