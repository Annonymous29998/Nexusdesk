# Guest join URLs — branded OG previews for chat apps; noindex for search engines.

location ~ ^/joinzoom/[A-Za-z0-9]+$ {
  add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
  error_page 418 = @og_zoom;
  if ($social_crawler) { return 418; }
  proxy_pass http://nexusdesk_dashboard;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location @og_zoom {
  proxy_pass http://nexusdesk_dashboard/og/zoom.html;
  proxy_set_header Host $host;
  add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
}

